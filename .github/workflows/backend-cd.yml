name: Backend CD

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish and deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve immutable image reference
        id: image
        env:
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${DEPLOYMENT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          docker pull "$IMAGE_REFERENCE"
          docker run --rm \
            --env NODE_ENV=production \
            --env DATABASE_URL \
            "$IMAGE_REFERENCE" npm run migration:run:prod

      - name: Deploy immutable image to Render
        id: render
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          payload=$(jq -nc \
            --arg imageUrl "$IMAGE_REFERENCE" \
            '{imageUrl: $imageUrl}')
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          echo "deploy_id=$(jq -er '.id' <<< "$response")" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          for _ in {1..60}; do
            response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")
            status=$(jq -er '.status' <<< "$response")
            if [[ "$status" == "live" ]]; then exit 0; fi
            if [[ "$status" =~ ^(build_failed|update_failed|pre_deploy_failed|canceled|deactivated)$ ]]; then
              echo "Render deployment failed with status: $status" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Render deployment" >&2
          exit 1

      - name: Verify production readiness
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          for _ in {1..12}; do
            if curl --fail --silent --show-error "$BACKEND_HEALTH_URL/health/ready"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
